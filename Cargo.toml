[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tau-rs/arch"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
arch-facts = { path = "crates/arch-facts" }
arch-analyze = { path = "crates/arch-analyze" }
arch-views = { path = "crates/arch-views" }
arch-session = { path = "crates/arch-session" }
arch-forge = { path = "crates/arch-forge" }
arch-driver = { path = "crates/arch-driver" }
arch-api = { path = "crates/arch-api" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.58", default-features = false }
toml = "0.9"
globset = { version = "0.4", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
pretty_assertions = "1"
