[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tau-rs/arch"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
arch-facts = { path = "crates/arch-facts" }
arch-analyze = { path = "crates/arch-analyze" }
arch-views = { path = "crates/arch-views" }
arch-session = { path = "crates/arch-session" }
arch-forge = { path = "crates/arch-forge" }
arch-driver = { path = "crates/arch-driver" }
arch-api = { path = "crates/arch-api" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
jsonschema = { version = "0.58", default-features = false }
toml = "0.9"
globset = { version = "0.4", default-features = false }
rusqlite = { version = "0.37", features = ["bundled"] }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
jiff = { version = "0.2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
rustix = { version = "1", default-features = false, features = ["std", "process"] }
pretty_assertions = "1"

# rust-analyzer's internal `never!` checks panic in debug builds and only log in release. A
# pinned cross target (ADR 0030) trips one in the build-script run: cargo reports a host-only
# build dependency (`core-foundation-sys` checking for Linux on macOS) that the target-filtered
# metadata does not list. Debug builds analyse as release ones do.
[profile.dev.package.ra_ap_project_model]
debug-assertions = false
