name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/fetch-fixtures.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --workspace --bins

  dependency-direction:
    name: dependency direction (arrows go one way)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the workspace passes
        run: scripts/check-dep-direction.sh
      - name: a reverse dependency fails
        run: |
          set -eu
          tmp=$(mktemp -d)
          cp -R . "$tmp/ws"
          printf 'arch-views.workspace = true\n' >> "$tmp/ws/crates/arch-facts/Cargo.toml"
          (cd "$tmp/ws" && cargo metadata --format-version 1 --no-deps > "$tmp/meta.json")
          if METADATA="$tmp/meta.json" scripts/check-dep-direction.sh; then
            echo "check did not fail on arch-facts -> arch-views"; exit 1
          fi
          echo "negative test passed: the check rejects a reverse dependency"
