name: ci
on:
  push:
    branches: [main]
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The fixture submodules (fixtures/repos/) stay pinned gitlinks: nothing here builds them,
          # and zed is huge. fixtures/checks/tests/golden.rs reads `git log -- fixtures/repos/<repo>/`,
          # which a shallow clone cannot answer.
          submodules: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          # rust-src: rust-analyzer resolves std from its sources (arch-analyze, ADR 0010).
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: fixture pins are recorded
        run: git submodule status | tee /dev/stderr | awk '{ if (length($1) < 40) exit 1 }'
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo build --workspace --bins

  budgets:
    name: "budgets (ADR 0026): first index, one-file recompute"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: budgets
      # The budgets are stated for the reference machine, which fixtures/checks/budgets.toml
      # names (tau-rs/arch-fixtures#5). A shared runner has a quarter of a laptop's cores, so it
      # declares a factor of 2 until that file exists.
      - run: cargo bench -p arch-analyze --bench budgets
        env:
          ARCH_BUDGET_SCALE: "2"
      # incremental_equals_cold at resolved depth (ADR 0002): rust-analyzer loads once per cold
      # analysis, too slow for a debug build.
      - run: cargo test --release -p arch-analyze --test incremental -- --ignored

  same-inputs:
    name: "same_inputs_same_facts (ADR 0030): ${{ matrix.os }}"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src
          # smallsvc pins x86_64-unknown-linux-gnu in its areas.toml: macOS analyses for it.
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: same-inputs
      # Two checkouts at different paths, each with its own target/ and store: same facts.
      - run: cargo test --release -p arch-analyze --test same_inputs -- --ignored
        env:
          ARCH_FACTS_OUT: ${{ runner.temp }}/facts-${{ runner.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: same-inputs-${{ runner.os }}
          path: ${{ runner.temp }}/facts-${{ runner.os }}.json

  same-inputs-across-machines:
    name: "same_inputs_same_facts (ADR 0030): Linux and macOS agree"
    needs: same-inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: same-inputs-*
          merge-multiple: true
      - name: byte-identical facts
        run: |
          set -eu
          ls -l facts-*.json
          if ! cmp facts-Linux.json facts-macOS.json; then
            diff facts-Linux.json facts-macOS.json | head -40
            exit 1
          fi

  zero2prod:
    name: "arch check on zero2prod (milestone 4)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: zero2prod
      # Fails on exit 1 (a blocking finding) or 2 (a tool error). Syntax-level facts only
      # warn (ADR 0009), so this proves the pipeline until resolved facts make findings block.
      - run: scripts/check-zero2prod.sh
        env:
          ARCH_REPORT: ${{ runner.temp }}/zero2prod-check.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zero2prod-check
          path: ${{ runner.temp }}/zero2prod-check.json
          if-no-files-found: ignore

  smallsvc:
    name: "smallsvc: the in-tree fixture service builds and passes"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fixtures/repos/smallsvc
      - run: cargo test --locked
        working-directory: fixtures/repos/smallsvc
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: fixtures/repos/smallsvc

  dependency-direction:
    name: dependency direction (arrows go one way)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: the workspace passes
        run: scripts/check-dep-direction.sh
      - name: a reverse dependency fails
        run: |
          set -eu
          tmp=$(mktemp -d)
          cp -R . "$tmp/ws"
          printf 'arch-views.workspace = true\n' >> "$tmp/ws/crates/arch-facts/Cargo.toml"
          (cd "$tmp/ws" && cargo metadata --format-version 1 --no-deps > "$tmp/meta.json")
          if METADATA="$tmp/meta.json" scripts/check-dep-direction.sh; then
            echo "check did not fail on arch-facts -> arch-views"; exit 1
          fi
          echo "negative test passed: the check rejects a reverse dependency"
